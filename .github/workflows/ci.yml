name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Run tests
        env:
          LC_ALL: C
          TERM: xterm
          BATS_OPTS: -F pretty
        run: test/run.sh

  coverage:
    # kcov's v42 release binary is linked against Ubuntu 22.04's exact
    # binutils .so versions (e.g. libopcodes-2.38-system.so), so it only
    # runs on that release. Matches bats-core's own coverage job:
    # https://github.com/bats-core/bats-core/blob/master/.github/workflows/tests.yml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install kcov
        run: |
          wget -q https://github.com/SimonKagstrom/kcov/releases/download/v42/kcov-amd64.tar.gz
          tar -xf kcov-amd64.tar.gz
          echo "$PWD/usr/local/bin" >> "$GITHUB_PATH"

      - name: Measure coverage
        env:
          LC_ALL: C
          TERM: xterm
          BATS_OPTS: -F pretty
        run: test/coverage.sh

      - name: Report coverage
        run: |
          jq -r '"Coverage: \(.percent_covered)% (\(.covered_lines)/\(.total_lines) lines)"' \
            .coverage/run.sh/coverage.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: .coverage/
          # .coverage/ is a dot-directory; upload-artifact skips hidden
          # files/dirs unless told otherwise, which silently uploaded
          # nothing (step still reports success either way).
          include-hidden-files: true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck 0.11.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Run shellcheck
        run: |
          command -v shellcheck
          test "$(command -v shellcheck)" = "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          shellcheck --version
          ./shellcheck.sh
